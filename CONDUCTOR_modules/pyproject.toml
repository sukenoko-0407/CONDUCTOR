[project]
name = "conductor-workspace"
version = "0.1.10"
description = "CONDUCTOR deterministic enrichment-to-Series SAR analysis runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4.21",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "rdkit>=2024.3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
]
