[project]
name = "conductor-workspace"
version = "0.1.8"
description = "Development and acceptance-test environment for the CONDUCTOR multi-Round analysis architecture"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4.21",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "rdkit>=2024.3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
]
