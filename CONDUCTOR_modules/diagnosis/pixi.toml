[project]
name = "conductor-diagnosis"
version = "0.2.1"
description = "CONDUCTOR 0.2.1 design calibration diagnostics. Measurement only."
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.13"
rdkit = ">=2024.03"
numpy = ">=1.26"
pandas = ">=2.0"
scipy = ">=1.11"
scikit-learn = ">=1.3"
pyyaml = ">=6.0"

[tasks]
run = "python run_diagnosis.py --config config.yaml"
selftest = "python run_diagnosis.py --selftest"
