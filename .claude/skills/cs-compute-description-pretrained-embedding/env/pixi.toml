[workspace]
name = "cs-compute-description-pretrained-embedding"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12" }, { platform = "win-64", cuda = "12" }]

[dependencies]
cuda-version = ">=12,<13"
jsonschema = ">=4.21"
numpy = ">=1.26"
pandas = ">=2.2"
pyarrow = ">=15"
python = ">=3.12,<3.13"
pytorch-gpu = ">=2.3"
rdkit = ">=2024.3"
transformers = ">=4.41"

[tasks]
run = "python ../scripts/run.py"
smoke = "python ../scripts/run.py --help"
