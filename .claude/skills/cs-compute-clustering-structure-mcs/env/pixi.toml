[workspace]
name = "cs-compute-clustering-structure-mcs"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
jsonschema = ">=4.21"
networkx = ">=3.2"
numpy = ">=1.26"
pandas = ">=2.2"
python = ">=3.12,<3.13"
rdkit = ">=2024.3"
scikit-learn = ">=1.4"
scipy = ">=1.12"

[tasks]
run = "python ../scripts/run.py"
smoke = "python ../scripts/run.py --help"
