[workspace]
name = "cs-compute-description-morgan"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
jsonschema = ">=4.21"
numpy = ">=1.26"
pandas = ">=2.2"
pyarrow = ">=15"
python = ">=3.12,<3.13"
rdkit = ">=2024.3"

[tasks]
run = "python ../scripts/run.py"
smoke = "python ../scripts/run.py --help"
