[workspace]
name = "cs-compute-clustering-meta-overlap"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
numpy = ">=1.26"
pandas = ">=2.2"
python = ">=3.12,<3.13"
python-igraph = ">=0.11"
leidenalg = ">=0.10"

[tasks]
run = "python ../scripts/run.py"
smoke = "python ../scripts/run.py --help"
