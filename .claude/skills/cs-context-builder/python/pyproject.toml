[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-context-builder"
version = "0.2.1"
description = "Deterministic context catalog and translation for CONDUCTOR 0.2.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "conductor-stat-core==0.2.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "rdkit>=2024.3",
  "scikit-learn>=1.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor_context_builder*"]
