[workspace]
name = "cs-conductor-runtime"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = ">=3.12,<3.13"
jsonschema = ">=4.21,<5"
referencing = ">=0.30,<1"
pandas = ">=2.2"
pyarrow = ">=15"

[tasks]
catalog = "python ../scripts/build_catalog.py"
state = "python ../scripts/state_manager.py"
smoke = "python -c \"import jsonschema, referencing, pandas, pyarrow\""
cli-help = "python ../scripts/state_manager.py --help"
