[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-runtime"
version = "0.2.1"
description = "CONDUCTOR 0.2.1 phase preparation and single-writer runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "conductor-stat-core==0.2.1",
  "jsonschema>=4.21",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "rdkit>=2024.3",
  "scipy>=1.12"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor_runtime*"]
