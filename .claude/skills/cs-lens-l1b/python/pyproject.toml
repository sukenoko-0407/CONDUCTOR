[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-lens-l1b"
version = "0.2.1"
description = "CONDUCTOR conditional-flatness lens"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "pandas>=2.2", "rdkit>=2024.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor_lens_l1b*"]
