[workspace]
name = "cs-analysis-interpret-results"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
jsonschema = ">=4.21,<5"
referencing = ">=0.30,<1"
numpy = ">=1.26"
pandas = ">=2.2"
python = ">=3.12,<3.13"

[tasks]
run = "python ../scripts/run.py"
smoke = "python -c \"import jsonschema, referencing, numpy, pandas\""
cli-help = "python ../scripts/run.py --help"
