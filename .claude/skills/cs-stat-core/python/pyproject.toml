[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-stat-core"
version = "0.2.1"
description = "Deterministic statistical primitives for CONDUCTOR 0.2.1"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.21", "numpy>=1.26", "pyyaml>=6.0", "scipy>=1.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor_stat_core*"]
