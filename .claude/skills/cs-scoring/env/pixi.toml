[workspace]
name="cs-scoring"
channels=["conda-forge"]
platforms=["linux-64","win-64"]
[dependencies]
python=">=3.12,<3.13"
[pypi-dependencies]
jsonschema=">=4.21"
numpy="==2.5.1"
pandas=">=2.2"
pyyaml=">=6.0"
rdkit="==2026.3.4"
scipy="==1.18.0"
conductor-stat-core={path="../../cs-stat-core/python",editable=true}
conductor-scoring={path="../python",editable=true}
[tasks]
run="python ../scripts/run.py"
smoke="python ../scripts/run.py --help"
