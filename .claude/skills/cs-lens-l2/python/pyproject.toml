[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-lens-l2"
version = "0.2.1"
description = "L2b series-residual lens for CONDUCTOR 0.2.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "conductor-stat-core==0.2.1",
  "numpy>=1.26",
  "pandas>=2.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor_lens_l2*"]
