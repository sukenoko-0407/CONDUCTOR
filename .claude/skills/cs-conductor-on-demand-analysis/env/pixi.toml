[workspace]
name = "cs-conductor-on-demand-analysis"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26"
pandas = ">=2.2"
pyarrow = ">=15"
scipy = ">=1.12"
scikit-learn = ">=1.4"
matplotlib = ">=3.8"
seaborn = ">=0.13"
networkx = ">=3.2"
rdkit = ">=2024.3"

[tasks]
on-demand = "python ../scripts/run.py"
smoke = "python ../scripts/run.py --help"
