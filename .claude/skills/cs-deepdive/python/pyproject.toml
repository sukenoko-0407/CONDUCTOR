[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="conductor-deepdive"
version="0.2.1"
description="CONDUCTOR deterministic deep-dive protocol"
requires-python=">=3.12,<3.13"
dependencies=["numpy>=1.26","pandas>=2.2","rdkit>=2024.3","scipy>=1.12"]
[tool.setuptools.packages.find]
where=["."]
include=["conductor_deepdive*"]
